include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema

pidfile /directory/slapd.pid
argsfile /directory/slapd.args
modulepath /usr/lib/ldap
moduleload back_mdb

TLSCACertificateFile /fixture/ca.pem
TLSCertificateFile /fixture/peer.pem
TLSCertificateKeyFile /fixture/peer.key
require LDAPv3
security simple_bind=128

database mdb
maxsize 10485760
suffix "dc=example,dc=test"
directory /directory

access to attrs=userPassword
    by anonymous auth
    by * none

access to attrs=entry,entryUUID
    by self read
    by dn.exact="cn=reader,dc=example,dc=test" read
    by * none

access to attrs=objectClass
    by self search
    by dn.exact="cn=reader,dc=example,dc=test" read
    by * none

access to *
    by dn.exact="cn=reader,dc=example,dc=test" read
    by * none
