name: Verify Arch User Repository packages
on:
  pull_request:
    paths:
      - '.forgejo/workflows/aur.yml'
      - 'deploy/aur/**'
      - 'global.json'
      - 'scripts/package-release.sh'
      - 'tests/aur-*.test.*'
  release:
    types: [published]
  workflow_dispatch:
jobs:
  aur:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'release' || github.event.release.prerelease == false)
    runs-on: asgard-ci
    timeout-minutes: 25
    container:
      image: archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91
    steps:
      - name: Install Arch packaging and runtime dependencies
        run: |
          pacman -Syu --needed --noconfirm ca-certificates git nodejs python dotnet-runtime-10.0 aspnet-runtime-10.0 nftables systemd
          useradd --system --create-home nergal-builder
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release selection and stage recipes
        run: |
          python3 -B scripts/test-ci-runner-policy.py
          python3 -B tests/aur-release.test.py
          stage="$(mktemp -d)"
          cp -R deploy/aur/nergal-bin deploy/aur/nergal-git deploy/aur/update-bin.py "$stage/"
          chown -R nergal-builder "$stage"
          echo "AUR_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Refresh the binary recipe from the published release
        if: github.event_name != 'pull_request'
        run: runuser -u nergal-builder -- python3 -B "$AUR_STAGE/update-bin.py"
      - name: Verify current package recipe builds this revision
        if: github.event_name == 'pull_request'
        run: |
          # The public VCS URL remains in the AUR recipe. For PR testing only,
          # supply the checked-out revision through a temporary local Git remote.
          git clone --no-local --bare "$GITHUB_WORKSPACE" "$AUR_STAGE/candidate"
          git --git-dir="$AUR_STAGE/candidate" update-ref refs/heads/main "$(git rev-parse HEAD)"
          chown -R nergal-builder "$AUR_STAGE/candidate"
          # makepkg intentionally ignores the build user's Git configuration.
          git config --file "$AUR_STAGE/gitconfig" url."file://$AUR_STAGE/candidate".insteadOf https://git.lantea.one/lantea-one/nergal.git
          echo "MAKEPKG_GIT_CONFIG=$AUR_STAGE/gitconfig" >> "$GITHUB_ENV"
      - name: Build both variants with makepkg and install with pacman
        run: |
          bash tests/aur-packages.test.sh "$AUR_STAGE" nergal-builder
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            built=$(runuser -u nergal-builder -- git -C "$AUR_STAGE/nergal-git/src/nergal" rev-parse HEAD)
            test "$built" = "$(git rev-parse HEAD)"
          fi
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: github.event_name != 'pull_request'
        with:
          name: nergal-bin-aur-recipe
          path: |
            ${{ env.AUR_STAGE }}/nergal-bin/PKGBUILD
            ${{ env.AUR_STAGE }}/nergal-bin/.SRCINFO
            ${{ env.AUR_STAGE }}/nergal-bin/LICENSE
          include-hidden-files: true
          if-no-files-found: error
