name: Verify Arch User Repository packages
on:
  pull_request:
    paths:
      - '.forgejo/workflows/aur.yml'
      - 'deploy/aur/**'
      - 'deploy/container/release-version.py'
      - 'deploy/systemd/**'
      - 'Directory.Build.props'
      - 'global.json'
      - 'scripts/package-release.sh'
      - 'tests/aur-*.test.*'
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: aur-${{ github.event_name }}-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false
jobs:
  aur:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'release' || (github.event.release.prerelease == false && github.event.release.draft == false))
    runs-on: asgard-ci
    timeout-minutes: 25
    container:
      image: archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91
    steps:
      - name: Install Arch packaging and runtime dependencies
        run: |
          pacman -Syu --needed --noconfirm ca-certificates curl git nodejs python dotnet-runtime-10.0 aspnet-runtime-10.0 nftables systemd
          useradd --system --create-home nergal-builder
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || '' }}
      - name: Verify release selection and stage recipes
        env:
          AUR_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          python3 -B scripts/test-ci-runner-policy.py
          python3 -B tests/aur-release.test.py
          python3 -B tests/aur-attachment.test.py
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            [[ "${AUR_RELEASE_ID:?Missing release ID}" =~ ^[1-9][0-9]*$ ]]
            # Compiled debug metadata includes build paths. Use the same path
            # in each disposable job container so the archive survives retries.
            stage="/tmp/nergal-aur-release-$AUR_RELEASE_ID"
            mkdir -m 0700 "$stage"
          else
            stage="$(mktemp -d)"
          fi
          cp -R deploy/aur/nergal-bin deploy/aur/nergal-git deploy/aur/update-bin.py "$stage/"
          chown -R nergal-builder "$stage"
          echo "AUR_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Verify current package recipe builds this revision
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Resolve the tested PR or release revision through a temporary mirror.
          # The exported AUR recipe retains the public VCS URL.
          git clone --no-local --bare "$GITHUB_WORKSPACE" "$AUR_STAGE/candidate"
          git --git-dir="$AUR_STAGE/candidate" update-ref refs/heads/main "$(git rev-parse HEAD)"
          chown -R nergal-builder "$AUR_STAGE/candidate"
          # makepkg intentionally ignores the build user's Git configuration.
          git config --file "$AUR_STAGE/gitconfig" url."file://$AUR_STAGE/candidate".insteadOf https://git.lantea.one/lantea-one/nergal.git
          echo "MAKEPKG_GIT_CONFIG=$AUR_STAGE/gitconfig" >> "$GITHUB_ENV"
      - name: Build the Git package and its verified Linux archive
        run: |
          revision=$(git rev-parse HEAD)
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cd "$AUR_STAGE/nergal-git"
          runuser -u nergal-builder -- makepkg --printsrcinfo | diff -u .SRCINFO -
          runuser -u nergal-builder -- makepkg --noconfirm
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            built=$(runuser -u nergal-builder -- git -C src/nergal rev-parse HEAD)
            test "$built" = "$revision"
          fi
      - name: Attach the Linux archive and checksum to the Forgejo release
        if: github.event_name == 'release'
        env:
          AUR_RELEASE_ID: ${{ github.event.release.id }}
          AUR_RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: |
          version=$(python3 -B deploy/container/release-version.py version "refs/tags/$AUR_RELEASE_TAG")
          payload="$AUR_STAGE/nergal-git/src/payload"
          (cd "$payload" && sha256sum --check --strict SHA256SUMS)
          bash deploy/aur/attach-release-assets.sh "$payload/nergal_${version}_linux-x64.tar.gz" "$payload/SHA256SUMS"
      - name: Refresh the binary recipe from the published release
        if: github.event_name != 'pull_request'
        env:
          AUR_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          selection=()
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            selection=(--tag "${AUR_RELEASE_TAG:?Missing release tag}")
          fi
          runuser -u nergal-builder -- python3 -B "$AUR_STAGE/update-bin.py" "${selection[@]}"
      - name: Build and install the binary package and verify both variants
        run: |
          (
            cd "$AUR_STAGE/nergal-bin"
            runuser -u nergal-builder -- makepkg --printsrcinfo | diff -u .SRCINFO -
            runuser -u nergal-builder -- makepkg --noconfirm
          )
          bash tests/aur-packages.test.sh "$AUR_STAGE"
      - name: Stage both tested recipes
        if: github.event_name != 'pull_request'
        run: |
          cd "$AUR_STAGE"
          # makepkg computes the VCS pkgver in PKGBUILD during the test build.
          (cd nergal-git && runuser -u nergal-builder -- makepkg --printsrcinfo > .SRCINFO)
          for package in nergal-bin nergal-git; do
            install -D -m 0644 "$package/PKGBUILD" "recipes/$package/PKGBUILD"
            install -m 0644 "$package/.SRCINFO" "$package/LICENSE" "recipes/$package/"
          done
          (cd recipes && python3 -m zipfile -c ../nergal-aur-recipes.zip nergal-bin nergal-git)
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        if: github.event_name != 'pull_request'
        with:
          name: nergal-aur-recipes
          path: ${{ env.AUR_STAGE }}/recipes/
          include-hidden-files: true
          if-no-files-found: error
      - name: Attach the tested recipes to the Forgejo release
        if: github.event_name == 'release'
        env:
          AUR_RELEASE_ID: ${{ github.event.release.id }}
          AUR_RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: bash deploy/aur/attach-release-assets.sh "$AUR_STAGE/nergal-aur-recipes.zip"
