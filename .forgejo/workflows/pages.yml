name: Deploy Forgejo Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: heimdall-ci
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify shared organization runner policy
        run: python3 -B scripts/test-ci-runner-policy.py
      - name: Verify Pages portal structure and links
        run: python3 scripts/verify-pages.py
      - name: Publish pages/ to Forgejo Pages
        uses: https://codeberg.org/git-pages/action@7f9731f428a25eaf47b42794263a0c100af9a363
        with:
          site: https://lantea-one.pages.lantea.one/nergal/
          server: pages.lantea.one
          token: ${{ forgejo.token }}
          source: pages/
          strict: true
          comment: ${{ forgejo.sha }}
