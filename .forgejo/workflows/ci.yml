name: Build and test nergal
on:
  push:
    branches: [main, 'codex/**', 'renovate/**']
  workflow_dispatch:
jobs:
  verify:
    runs-on: asgard-ci
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify shared organization runner policy
        run: |
          python3 -B scripts/test-ci-runner-policy.py
          python3 -B scripts/verify-agent-config.py
          python3 -B scripts/test-agent-config.py
      - uses: https://github.com/actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: https://github.com/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Verify locally bundled editor assets
        run: |
          npm ci --prefix tools/web-assets --ignore-scripts
          npm run verify --prefix tools/web-assets
          node --test scripts/navigation.test.mjs scripts/app-theme.test.mjs scripts/pages-theme.test.mjs scripts/local-time.test.mjs
          python3 -B scripts/test-dev-watch.py
      - name: Restore locked dependencies
        run: dotnet restore Nergal.slnx --locked-mode
      - name: Build without warnings
        run: dotnet build Nergal.slnx --configuration Release --no-restore
      - name: Verify formatting
        run: dotnet format Nergal.slnx --verify-no-changes --no-restore
      - name: Run unit tests
        run: bash scripts/test-unit.sh
      - name: Check MVC, Blazor and health endpoints
        run: bash scripts/smoke-web.sh
      - name: Verify offline local administrator provisioning and terminal handling
        run: python3 -B tests/integration/admin/check.py
      - name: Verify local administrator sessions on loopback HTTPS
        run: |
          python3 tests/integration/local-sessions/check.py
          python3 -B tests/integration/local-sessions/check-settings.py
      - name: Verify optional OIDC with a disposable HTTPS issuer
        run: python3 -B tests/integration/oidc/check.py
      - name: Verify Forgejo Pages documentation portal
        run: python3 -B scripts/verify-pages.py
      - name: Assemble and verify Linux release packages
        run: bash scripts/package-release.sh --verify
